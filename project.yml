# Generates Earwig.xcodeproj (git-ignored). Regenerate after adding or removing files:
#   xcodegen generate
name: Earwig
options:
  bundleIdPrefix: com.bowerhaus
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: S7K2GRB2RN
    CODE_SIGN_STYLE: Automatic
    # The version the app reports. scripts/release/testflight.sh bumps the build, uploads, then
    # commits and tags it; App Store Connect refuses a build number it has already seen.
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Earwig:
    type: application
    platform: iOS
    sources:
      - path: Earwig
    info:
      path: Earwig/Resources/Info.plist
      properties:
        CFBundleDisplayName: Earwig
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # White status bar on the sky blue, whatever the scheme (plan 011, decision 16).
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        NSCameraUsageDescription: Earwig films your take with the front camera when you choose Video, so you can watch it back.
        # Without it the share sheet leaves out Save Video (plan 010, check 4).
        NSPhotoLibraryAddUsageDescription: Earwig saves a take's video to Photos when you choose Save Video.
        # Recordings are kept in Documents/Recordings, shown in the Files app (plan 010).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: Earwig listens to you so the prompt keeps pace with what you say.
        NSSpeechRecognitionUsageDescription: Earwig recognises your speech on this iPhone to follow your place in the script. Nothing leaves the phone.
        # Personal Voice has no documented usage-description key; its authorisation is
        # requested in code with AVSpeechSynthesizer.requestPersonalVoiceAuthorization.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        # The colour alone, the theme's sky blue, so the splash overlay fades in from it with no
        # handover to see (plan 007). iOS caches launch screens across reinstalls: restart the
        # phone to see a change.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bowerhaus.Earwig
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
  EarwigTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EarwigTests
    dependencies:
      - target: Earwig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bowerhaus.EarwigTests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Earwig:
    build:
      targets:
        Earwig: all
        EarwigTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - EarwigTests
    archive:
      config: Release
